<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/><stop offset="100" stop-color="#061109"/>
    </linearGradient>
    <linearGradient id="tt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ffb0"/><stop offset="100" stop-color="#37d0ff"/>
    </linearGradient>
    <pattern id="tg" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 H0 V26" fill="none" stroke="#39ffb0" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="560" height="200" rx="16" fill="url(#tb)"/>
  <rect width="560" height="200" rx="16" fill="url(#tg)"/>
  <rect x="1" y="1" width="558" height="198" rx="16" fill="none" stroke="#39ffb0" stroke-opacity="0.3"/>
  <rect x="0" y="0" width="6" height="200" rx="3" fill="url(#tt)"/>

  <!-- icon -->
  <g transform="translate(30,28)">
    <rect width="52" height="52" rx="13" fill="#0e1a12" stroke="#39ffb0" stroke-opacity="0.5"/>
    <text x="26" y="36" font-size="26" text-anchor="middle">🛡️</text>
  </g>
  <text x="98" y="50" font-size="24" font-weight="800" fill="url(#tt)">pentesting-toolkit</text>
  <text x="98" y="74" font-family="monospace" font-size="12.5" fill="#8fa3bf">offensive-security · curated · open-source</text>

  <!-- description -->
  <text x="30" y="112" font-size="14" fill="#cdd8ea">A domain-structured pentesting resource hub —</text>
  <text x="30" y="133" font-size="14" fill="#cdd8ea">tool references, a phased engagement playbook, and</text>
  <text x="30" y="154" font-size="14" fill="#cdd8ea">copy-paste cheatsheets. Free &amp; open source.</text>

  <!-- stat chips -->
  <g font-family="monospace" font-size="12" fill="#04120a">
    <rect x="30" y="168" width="118" height="22" rx="11" fill="#39ffb0"/>
    <text x="42" y="183">91 tool pages</text>
    <rect x="158" y="168" width="112" height="22" rx="11" fill="#37d0ff"/>
    <text x="170" y="183">20 domains</text>
    <rect x="280" y="168" width="120" height="22" rx="11" fill="#9b6bff"/>
    <text x="292" y="183" fill="#fff">6 kill-phases</text>
  </g>
</svg>
