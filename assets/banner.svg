<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="55" stop-color="#0a1120"/>
      <stop offset="100" stop-color="#04140c"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="55" stop-color="#39ffb0"/>
      <stop offset="100" stop-color="#37d0ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="10%" r="60%">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0.28"/>
      <stop offset="100" stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="90%" r="55%">
      <stop offset="0" stop-color="#37d0ff" stop-opacity="0.22"/>
      <stop offset="100" stop-color="#37d0ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 H0 V34" fill="none" stroke="#37d0ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="none" stroke="#39ffb0" stroke-opacity="0.25"/>

  <!-- terminal prompt chip -->
  <g transform="translate(64,70)">
    <rect x="0" y="0" width="150" height="30" rx="8" fill="#0e1a12" stroke="#39ffb0" stroke-opacity="0.5"/>
    <circle cx="16" cy="15" r="4" fill="#ff5c8a"/>
    <circle cx="30" cy="15" r="4" fill="#f5c451"/>
    <circle cx="44" cy="15" r="4" fill="#39ffb0"/>
    <text x="60" y="20" font-family="monospace" font-size="13" fill="#8fa3bf">~/whoami</text>
  </g>

  <!-- name -->
  <text x="62" y="180" font-size="66" font-weight="800" letter-spacing="-1" fill="url(#name)">Sindhura Kona</text>
  <!-- role -->
  <text x="66" y="222" font-family="monospace" font-size="21" fill="#39ffb0">Security Researcher</text>
  <text x="300" y="222" font-family="monospace" font-size="21" fill="#5b6b82">·</text>
  <text x="318" y="222" font-family="monospace" font-size="21" fill="#37d0ff">Offensive Security</text>
  <text x="560" y="222" font-family="monospace" font-size="21" fill="#5b6b82">·</text>
  <text x="578" y="222" font-family="monospace" font-size="21" fill="#9b6bff">Tooling</text>

  <!-- tagline -->
  <text x="64" y="262" font-size="15" fill="#8fa3bf">Breaking it before the bad guys do — building free &amp; open-source security tooling.</text>

  <!-- decorative QR glyph -->
  <g transform="translate(1000,84)" opacity="0.9">
    <rect x="-14" y="-14" width="168" height="168" rx="16" fill="#0b1526" stroke="#37d0ff" stroke-opacity="0.35"/>
    <g fill="#39ffb0">
      <rect x="8" y="8" width="40" height="40"/><rect x="16" y="16" width="24" height="24" fill="#0b1526"/><rect x="22" y="22" width="12" height="12" fill="#39ffb0"/>
      <rect x="92" y="8" width="40" height="40"/><rect x="100" y="16" width="24" height="24" fill="#0b1526"/><rect x="106" y="22" width="12" height="12" fill="#39ffb0"/>
      <rect x="8" y="92" width="40" height="40"/><rect x="16" y="100" width="24" height="24" fill="#0b1526"/><rect x="22" y="106" width="12" height="12" fill="#39ffb0"/>
    </g>
    <g fill="#37d0ff">
      <rect x="60" y="8" width="10" height="10"/><rect x="60" y="30" width="10" height="10"/><rect x="60" y="60" width="10" height="10"/>
      <rect x="92" y="60" width="10" height="10"/><rect x="114" y="60" width="10" height="10"/><rect x="60" y="92" width="10" height="10"/>
      <rect x="82" y="82" width="10" height="10"/><rect x="104" y="104" width="10" height="10"/><rect x="82" y="114" width="10" height="10"/><rect x="122" y="92" width="10" height="10"/>
      <rect x="92" y="122" width="10" height="10"/><rect x="122" y="122" width="10" height="10"/>
    </g>
  </g>
</svg>
