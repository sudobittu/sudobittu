<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/><stop offset="100" stop-color="#0c0916"/>
    </linearGradient>
    <linearGradient id="st" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b6bff"/><stop offset="100" stop-color="#37d0ff"/>
    </linearGradient>
    <pattern id="sg" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 H0 V26" fill="none" stroke="#9b6bff" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="560" height="200" rx="16" fill="url(#sb)"/>
  <rect width="560" height="200" rx="16" fill="url(#sg)"/>
  <rect x="1" y="1" width="558" height="198" rx="16" fill="none" stroke="#9b6bff" stroke-opacity="0.35"/>
  <rect x="0" y="0" width="6" height="200" rx="3" fill="url(#st)"/>

  <g transform="translate(30,28)">
    <rect width="52" height="52" rx="13" fill="#120e1e" stroke="#9b6bff" stroke-opacity="0.5"/>
    <text x="26" y="36" font-size="26" text-anchor="middle">📡</text>
  </g>
  <text x="98" y="50" font-size="23" font-weight="800" fill="url(#st)">signal-hijacked-research</text>
  <text x="98" y="74" font-family="monospace" font-size="12.5" fill="#8fa3bf">original research · QR phishing · mobile</text>

  <text x="30" y="112" font-size="14" fill="#cdd8ea">"The Signal Switch" — the measurable moment a user</text>
  <text x="30" y="133" font-size="14" fill="#cdd8ea">shifts from skepticism to compliance under a QR-based</text>
  <text x="30" y="154" font-size="14" fill="#cdd8ea">phishing attack over a trusted messaging channel.</text>

  <g font-family="monospace" font-size="12">
    <rect x="30" y="168" width="150" height="22" rx="11" fill="#9b6bff"/>
    <text x="42" y="183" fill="#fff">DEF CON 34 disclosure</text>
    <rect x="190" y="168" width="140" height="22" rx="11" fill="#37d0ff"/>
    <text x="202" y="183" fill="#04120a">carrier-gateway detect</text>
